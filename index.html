<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My 2026 Logbook (Dark)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { 950: '#0a0a0f', 900: '#12121a', 800: '#1a1a24', 700: '#2a2a35' }
                    }
                }
            }
        }
    </script>
    <style>
        .fade-in { animation: fadeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        /* Custom date picker icon color */
        ::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
    </style>
</head>
<body class="bg-dark-950 text-slate-300 font-sans min-h-screen flex flex-col items-center justify-center p-4 antialiased selection:bg-indigo-500/30 selection:text-white">

    <div id="login-screen" class="text-center fade-in w-full max-w-sm">
        <div class="mb-8">
             <h1 class="text-5xl font-extrabold mb-3 text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-blue-500 drop-shadow-[0_0_15px_rgba(99,102,241,0.3)]">2026 Log.</h1>
            <p class="text-slate-500 text-lg">Your personal growth tracker.</p>
        </div>
        <button id="btn-login" class="w-full bg-dark-900 hover:bg-dark-800 border border-dark-700 text-white px-6 py-4 rounded-2xl shadow-lg transition-all duration-300 flex items-center justify-center gap-4 group font-medium">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-6 h-6 brightness-[0.8] group-hover:brightness-100 transition" alt="Google">
            <span>Continue with Google</span>
        </button>
    </div>

    <div id="app-screen" class="hidden w-full max-w-lg fade-in py-8 relative">
        <header class="flex justify-between items-end mb-8 px-2">
            <div>
                <h2 class="text-3xl font-bold text-white tracking-tight">Hi, <span id="user-name" class="text-indigo-400">...</span></h2>
                <p class="text-sm text-slate-500 mt-1 flex items-center gap-2">
                    <span class="inline-block w-2 h-2 bg-green-500 rounded-full shadow-[0_0_8px_rgba(34,197,94,0.5)]"></span>
                    <span id="current-date-text">Loading...</span>
                </p>
            </div>
            <button id="btn-logout" class="text-sm text-slate-500 hover:text-red-400 transition py-2 px-4 rounded-lg hover:bg-dark-900">Logout</button>
        </header>

        <form id="logbook-form" class="bg-dark-900 p-8 rounded-[2rem] shadow-[0_20px_40px_-15px_rgba(0,0,0,0.7)] border border-dark-700/50 space-y-8 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-indigo-600 via-blue-500 to-indigo-600 opacity-80"></div>
            <div class="absolute -top-[100px] -right-[100px] w-40 h-40 bg-indigo-600/20 rounded-full blur-[80px] pointer-events-none"></div>

            <div class="relative z-10">
                <label class="block text-sm font-medium text-indigo-300 mb-2 uppercase tracking-wider">Tanggal Jurnal 📅</label>
                <input type="date" id="input-date" required 
                    class="w-full p-4 bg-dark-800 text-white border border-dark-700 rounded-xl focus:ring-2 focus:ring-indigo-500/50 outline-none transition-all shadow-sm">
            </div>

            <div class="relative z-10">
                <label class="block text-sm font-medium text-indigo-300 mb-2 uppercase tracking-wider">Daily Highlight 🏆</label>
                <input type="text" id="input-highlight" required placeholder="Satu kemenangan hari ini..." 
                    class="w-full p-4 bg-dark-800 text-white placeholder-slate-600 border border-dark-700 rounded-xl focus:ring-2 focus:ring-indigo-500/50 outline-none transition-all shadow-sm">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 relative z-10">
                <div>
                    <label class="block text-sm font-medium text-indigo-300 mb-3 uppercase tracking-wider">Mood</label>
                    <div class="flex justify-between bg-dark-800 p-2 rounded-2xl border border-dark-700" id="mood-container">
                        <button type="button" data-val="1" class="btn-mood text-3xl transition-all p-2 rounded-xl grayscale hover:grayscale-0 hover:bg-dark-700 hover:scale-110">😡</button>
                        <button type="button" data-val="2" class="btn-mood text-3xl transition-all p-2 rounded-xl grayscale hover:grayscale-0 hover:bg-dark-700 hover:scale-110">😞</button>
                        <button type="button" data-val="3" class="btn-mood text-3xl transition-all p-2 rounded-xl grayscale hover:grayscale-0 hover:bg-dark-700 hover:scale-110">😐</button>
                        <button type="button" data-val="4" class="btn-mood text-3xl transition-all p-2 rounded-xl grayscale hover:grayscale-0 hover:bg-dark-700 hover:scale-110">🙂</button>
                        <button type="button" data-val="5" class="btn-mood text-3xl transition-all p-2 rounded-xl grayscale hover:grayscale-0 hover:bg-dark-700 hover:scale-110">🤩</button>
                    </div>
                    <input type="hidden" id="input-mood">
                </div>
                <div>
                    <label class="block text-sm font-medium text-indigo-300 mb-3 uppercase tracking-wider flex justify-between">
                        <span>Enjoyment</span>
                        <span class="text-white font-bold"><span id="enjoy-val" class="text-indigo-400">50</span>%</span>
                    </label>
                    <div class="px-1 py-2">
                        <input type="range" id="input-enjoy" min="0" max="100" value="50" class="w-full h-3 bg-dark-800 rounded-full appearance-none cursor-pointer accent-indigo-500 ring-1 ring-dark-700">
                    </div>
                </div>
            </div>

            <div class="relative z-10">
                <label class="block text-sm font-medium text-indigo-300 mb-2 uppercase tracking-wider">Aktivitas & Refleksi</label>
                <textarea id="input-activity" rows="4" placeholder="Ceritakan proses hari ini..." class="w-full p-4 bg-dark-800 text-white placeholder-slate-600 border border-dark-700 rounded-xl focus:ring-2 focus:ring-indigo-500/50 outline-none transition-all shadow-sm resize-none"></textarea>
            </div>

            <button type="submit" id="btn-check" class="relative z-10 w-full py-4 bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 text-white font-bold text-lg rounded-2xl shadow-lg transition-all transform hover:-translate-y-1 active:scale-[0.98]">
                Simpan Jurnal
            </button>
        </form>

        <div class="mt-16 mb-20 px-2">
            <h3 class="text-xl font-bold text-white mb-6 flex items-center gap-3">
                <span class="flex items-center justify-center w-8 h-8 bg-indigo-900/50 text-indigo-400 rounded-lg shadow-sm">📜</span> Riwayat Perjalanan
            </h3>
            <div id="history-list" class="space-y-5">
                <p class="text-center text-slate-600 py-8 animate-pulse">Sinkronisasi data...</p>
            </div>
        </div>
    </div>

    <div id="modal-confirm" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 backdrop-blur-sm p-4 fade-in">
        <div class="bg-dark-900 border border-dark-700 p-6 rounded-2xl max-w-sm w-full shadow-2xl">
            <h3 class="text-xl font-bold text-white mb-2">Data Sudah Ada! ⚠️</h3>
            <p class="text-slate-400 mb-6">Kamu sudah mengisi logbook untuk tanggal <span id="modal-date" class="text-indigo-400 font-bold"></span>. Apakah kamu ingin menimpa data sebelumnya?</p>
            <div class="flex gap-3">
                <button id="btn-cancel-save" class="flex-1 py-3 px-4 bg-dark-800 hover:bg-dark-700 text-slate-300 rounded-xl font-medium transition">Batal</button>
                <button id="btn-force-save" class="flex-1 py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold transition">Timpa Data</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- ⚠️ PASTE CONFIG KAMU DI SINI (YANG TADI) ⚠️ ---
        const firebaseConfig = {
            apiKey: "AIzaSyCq3umCZzLg7SWhL0_mLOzc4nUTZ1ztutw",
            authDomain: "my2026log-55905.firebaseapp.com",
            projectId: "my2026log-55905",
            storageBucket: "my2026log-55905.firebasestorage.app",
            messagingSenderId: "1066605478698",
            appId: "1:1066605478698:web:d7db1e7f457c4b9d981453"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // Elements
        const loginScreen = document.getElementById('login-screen');
        const appScreen = document.getElementById('app-screen');
        const logForm = document.getElementById('logbook-form');
        const inputDate = document.getElementById('input-date'); // Input Tanggal Baru
        const modalConfirm = document.getElementById('modal-confirm');
        let currentUser = null;
        let pendingData = null; // Untuk nyimpen data sementara sebelum dikonfirmasi

        // Auth Listener
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                loginScreen.classList.add('hidden');
                appScreen.classList.remove('hidden');
                document.getElementById('user-name').innerText = user.displayName.split(" ")[0];

                // Set Default Tanggal ke Hari Ini
                const today = new Date();
                const yyyy = today.getFullYear();
                const mm = String(today.getMonth() + 1).padStart(2, '0');
                const dd = String(today.getDate()).padStart(2, '0');
                const todayFormatted = `${yyyy}-${mm}-${dd}`;
                
                inputDate.value = todayFormatted; // Set input date valuenya

                // Tampilkan tanggal cantik di header (Fixed Error)
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                document.getElementById('current-date-text').innerText = today.toLocaleDateString('id-ID', options);

                // Cek apakah hari ini sudah ada isinya?
                loadLogByDate(todayFormatted);
                loadHistory(user.uid);
            } else {
                currentUser = null;
                loginScreen.classList.remove('hidden');
                appScreen.classList.add('hidden');
            }
        });

        // Event Listeners
        document.getElementById('btn-login').addEventListener('click', () => signInWithPopup(auth, provider));
        document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

        // Listener Input Tanggal Berubah
        inputDate.addEventListener('change', (e) => {
            if(currentUser) loadLogByDate(e.target.value);
        });

        // Mood UI Logic
        const moodBtns = document.querySelectorAll('.btn-mood');
        moodBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                moodBtns.forEach(b => {
                    b.classList.remove('bg-indigo-600', 'text-white', 'shadow-lg', 'scale-110', 'grayscale-0');
                    b.classList.add('grayscale');
                });
                btn.classList.remove('grayscale');
                btn.classList.add('bg-indigo-600', 'text-white', 'shadow-lg', 'scale-110', 'grayscale-0');
                document.getElementById('input-mood').value = btn.getAttribute('data-val');
            });
        });

        document.getElementById('input-enjoy').addEventListener('input', (e) => {
            document.getElementById('enjoy-val').innerText = e.target.value;
        });

        // --- CORE LOGIC: CHECK & SAVE ---
        
        logForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!currentUser) return;

            // 1. Siapkan Data
            const selectedDate = inputDate.value; // Ambil dari input tanggal
            if(!selectedDate) { alert("Pilih tanggal dulu!"); return; }

            const mood = document.getElementById('input-mood').value;
            if(!mood) { alert("Pilih mood dulu dong! 😊"); return; }

            const newData = {
                uid: currentUser.uid,
                date: selectedDate,
                highlight: document.getElementById('input-highlight').value,
                mood: parseInt(mood),
                enjoyment: parseInt(document.getElementById('input-enjoy').value),
                activity: document.getElementById('input-activity').value,
                timestamp: new Date()
            };

            // 2. Cek apakah tanggal ini sudah ada datanya?
            const docRef = doc(db, "jurnal_harian", selectedDate);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists() && docSnap.data().uid === currentUser.uid) {
                // KONDISI: Data Sudah Ada -> Tampilkan Modal Warning
                pendingData = newData; // Simpan data di memori sementara
                document.getElementById('modal-date').innerText = selectedDate;
                modalConfirm.classList.remove('hidden'); // Munculkan modal
            } else {
                // KONDISI: Data Belum Ada -> Langsung Simpan
                saveLogbook(newData);
            }
        });

        // Tombol Konfirmasi di Modal
        document.getElementById('btn-force-save').addEventListener('click', () => {
            if(pendingData) {
                saveLogbook(pendingData);
                modalConfirm.classList.add('hidden');
                pendingData = null;
            }
        });

        document.getElementById('btn-cancel-save').addEventListener('click', () => {
            modalConfirm.classList.add('hidden');
            pendingData = null;
        });

        // Fungsi Simpan ke Firebase
        async function saveLogbook(data) {
            const btnCheck = document.getElementById('btn-check');
            const originalText = btnCheck.innerText;
            btnCheck.innerText = "Menyimpan...";
            btnCheck.disabled = true;

            try {
                await setDoc(doc(db, "jurnal_harian", data.date), data);
                
                btnCheck.innerHTML = "✅ Tersimpan!";
                setTimeout(() => {
                     btnCheck.innerText = originalText;
                     btnCheck.disabled = false;
                }, 2000);
                
                loadHistory(currentUser.uid); // Refresh list bawah
            } catch (error) {
                console.error("Error:", error);
                alert("Gagal simpan: " + error.message);
                btnCheck.innerText = originalText;
                btnCheck.disabled = false;
            }
        }

        // Fungsi Load Data Form berdasarkan Tanggal yang dipilih
        async function loadLogByDate(dateStr) {
            // Reset form dulu biar bersih
            document.getElementById('input-highlight').value = "";
            document.getElementById('input-activity').value = "";
            document.getElementById('input-enjoy').value = 50;
            document.getElementById('enjoy-val').innerText = 50;
            document.getElementById('input-mood').value = "";
            moodBtns.forEach(b => {
                b.classList.remove('bg-indigo-600', 'text-white', 'shadow-lg', 'scale-110', 'grayscale-0');
                b.classList.add('grayscale');
            });

            // Cek Firebase
            const docSnap = await getDoc(doc(db, "jurnal_harian", dateStr));
            if (docSnap.exists() && docSnap.data().uid === currentUser.uid) {
                const data = docSnap.data();
                // Isi form dengan data yang ada
                document.getElementById('input-highlight').value = data.highlight;
                document.getElementById('input-activity').value = data.activity;
                document.getElementById('input-enjoy').value = data.enjoyment;
                document.getElementById('enjoy-val').innerText = data.enjoyment;
                const moodBtn = document.querySelector(`.btn-mood[data-val="${data.mood}"]`);
                if(moodBtn) moodBtn.click();
                
                // Kasih visual feedback kecil kalau ini mode edit
                console.log("Mode Edit: Data ditemukan untuk tanggal " + dateStr);
            }
        }

        // Load History (Sama seperti sebelumnya)
        async function loadHistory(uid) {
            const historyList = document.getElementById('history-list');
            try {
                const q = query(collection(db, "jurnal_harian"), where("uid", "==", uid));
                const querySnapshot = await getDocs(q);
                historyList.innerHTML = "";

                if (querySnapshot.empty) {
                    historyList.innerHTML = `<div class="text-center p-8 rounded-2xl border border-dark-800 bg-dark-900/50"><p class="text-slate-500">Belum ada catatan.</p></div>`;
                    return;
                }

                const dataArray = [];
                querySnapshot.forEach((doc) => { dataArray.push(doc.data()); });
                dataArray.sort((a, b) => new Date(b.date) - new Date(a.date));

                dataArray.forEach((data) => {
                    const moods = ["", "😡", "😞", "😐", "🙂", "🤩"];
                    const moodEmoji = moods[data.mood] || "❓";
                    const dateObj = new Date(data.date);
                    
                    const card = `
                        <div class="bg-dark-900 p-5 rounded-2xl border border-dark-800 shadow-sm hover:border-indigo-500/30 transition flex gap-5 items-start group">
                            <div class="bg-dark-800 border border-dark-700 text-indigo-300 font-bold rounded-xl p-3 text-center min-w-[70px]">
                                <div class="text-2xl">${dateObj.getDate()}</div>
                                <div class="text-xs uppercase text-indigo-400/70">${dateObj.toLocaleString('id-ID', { month: 'short' })}</div>
                            </div>
                            <div class="flex-1 py-1">
                                <div class="flex justify-between items-start mb-2">
                                    <h4 class="font-bold text-white text-base line-clamp-1 pr-4">${data.highlight || "Tanpa Judul"}</h4>
                                    <span class="text-2xl grayscale group-hover:grayscale-0 transition">${moodEmoji}</span>
                                </div>
                                <p class="text-sm text-slate-400 line-clamp-2 mb-4">${data.activity}</p>
                                <div class="flex items-center gap-3">
                                    <div class="h-2 w-full bg-dark-700 rounded-full overflow-hidden">
                                        <div class="h-full bg-gradient-to-r from-indigo-500 to-blue-500" style="width: ${data.enjoyment}%"></div>
                                    </div>
                                    <span class="text-xs font-bold text-indigo-300">${data.enjoyment}%</span>
                                </div>
                            </div>
                        </div>`;
                    historyList.innerHTML += card;
                });
            } catch (error) {
                console.error("Gagal load history:", error);
            }
        }
    </script>
</body>
</html>
